[project]
name = "endless-dungeon-server"
version = "0.1.0"
description = "EndlessDungeon game server — deterministic soulslike engine + LangGraph dungeon master + RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "pydantic>=2.9",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "qdrant-client>=1.11",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langsmith>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
